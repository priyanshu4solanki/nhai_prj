buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34

        // ✅ FIXED NDK VERSION (stable for RN 0.74)
        ndkVersion = "25.2.9519653"

        kotlinVersion = "1.9.22"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.4.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Disable native build for react-native-screens to fix CMake compatibility issues
ext {
    skipRNScreensNativeModule = true
}

// Apply CMake disable fix for react-native-screens module
subprojects {
    if (project.name == "react-native-screens") {
        afterEvaluate {
            // Disable externalNativeBuild to skip CMake configuration
            tasks.each { task ->
                if (task.name.contains("configureCMakeDebug") || task.name.contains("configureCMakeRelease")) {
                    task.enabled = false
                }
            }
        }
    }
}